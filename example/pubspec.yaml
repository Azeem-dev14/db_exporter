name: db_exporter_example
description: Exports three different local databases with db_exporter.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  db_exporter:
    path: ../

  # One demo per storage package, each with its own dataset.
  sqflite: ^2.3.3
  drift: ^2.20.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24

  path: ^1.9.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
