name: db_exporter_example
description: Exports the five most-used Flutter SQL databases with db_exporter.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  db_exporter:
    path: ../

  # The five most-used SQL packages, one dataset each.
  sqflite: ^2.3.3                 # Schools
  sqlite3: ^2.4.0                 # Bookstore
  drift: ^2.20.0                  # Music
  sqlite_async: ^0.11.0           # Weather
  sqflite_common_ffi: ^2.3.3      # Airports
  sqlite3_flutter_libs: ^0.5.24   # native SQLite for the FFI-based demos

  path: ^1.9.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
